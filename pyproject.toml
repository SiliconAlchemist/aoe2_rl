[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2-rl-lab"
version = "0.1.0"
description = "A measured, fog-limited AoE II DE reinforcement learning feasibility lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["age-of-empires", "reinforcement-learning", "imitation-learning", "rts", "replays"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = ["numpy>=2", "gymnasium>=1", "torch>=2.7", "psutil>=7", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
replays = ["mgz==1.8.51", "aocref==2.0.42", "construct==2.8.16", "tabulate==0.10.0"]
dev = ["pytest>=8", "lupa>=2", "AoE2ScenarioParser>=0.8"]
reverse-engineering = ["capstone==5.0.6"]

[project.scripts]
aoe2rl = "aoe2rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aoe2rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
